version: 1
stages:
  - key: proposal
    file: proposal.md
    label: 需求澄清
    command: matspec.proposal
    template: templates/delta/proposal.md
    required_for_done: true
  - key: delta-spec
    file: delta-spec.md
    label: 规格增量
    command: matspec.delta-spec
    template: templates/delta/delta-spec.md
    requiresFullSpec: false
    requiresFullDesign: false
    required_for_done: true
  - key: tasks
    file: tasks.md
    label: 任务拆解
    command: matspec.tasks
    template: templates/delta/tasks.md
    inputs:
      - matspec/specs/spec.md
      - matspec/specs/design.md
      - delta-spec.md
    requiresFullSpec: false
    requiresFullDesign: false
    required_for_done: true
  - key: implementation
    label: 实现
    command: matspec.implement
    delegate: task-executor
    noFile: true
    inputs:
      - tasks.md
    required_for_done: true
  - key: review
    file: review.md
    label: 实现审查
    command: matspec.review
    template: templates/delta/review.md
    inputs:
      - proposal.md
      - delta-spec.md
      - tasks.md
    requiresFullSpec: false
    requiresFullDesign: false
    delegate: stage-generator
    required_for_done: true
finalization:
  require_updated:
    - matspec/specs/spec.md
    - matspec/specs/design.md
  coverage:
    - delta: matspec/changes/{change}/delta-spec.md
      full: matspec/specs/spec.md
